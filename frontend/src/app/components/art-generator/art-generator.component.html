<div class="art-generator">
  <div class="generator-card">
    <div class="card-header">
      <h2>🎨 Create Your Masterpiece</h2>
      <p>Transform your imagination into stunning AI artwork</p>
    </div>
    
    <form (ngSubmit)="generateArt()" class="generator-form">
      <div class="form-row">
        <div class="form-group">
          <label for="title">🏷️ Title</label>
          <input 
            type="text" 
            id="title" 
            [(ngModel)]="title" 
            name="title"
            placeholder="Give your artwork a name"
            required>
        </div>
      </div>

      <div class="form-group">
        <label for="prompt">✨ Creative Prompt</label>
        <textarea 
          id="prompt" 
          [(ngModel)]="prompt" 
          name="prompt"
          placeholder="Describe your vision in detail... (e.g., 'A serene mountain landscape at sunset with vibrant colors')"
          rows="4"
          required></textarea>
      </div>

      <button 
        type="submit" 
        [disabled]="isGenerating || !prompt.trim() || !title.trim()"
        class="generate-btn">
        <span *ngIf="isGenerating" class="loading-content">
          <div class="spinner"></div>
          Creating Magic...
        </span>
        <span *ngIf="!isGenerating">
          🎨 Generate Artwork
        </span>
      </button>
    </form>

    <div *ngIf="error" class="error-card">
      <div class="error-icon">⚠️</div>
      <div class="error-content">
        <h4>Oops! Something went wrong</h4>
        <p>{{ error }}</p>
      </div>
    </div>
  </div>

  <div *ngIf="generatedArt" class="result-card">
    <div class="result-header">
      <h3>🎆 Your Artwork is Ready!</h3>
    </div>
    
    <div class="artwork-showcase">
      <div class="artwork-image">
        <img [src]="generatedArt.imageUrl" [alt]="generatedArt.title" />
        <div class="image-overlay">
          <button class="overlay-btn download-btn" (click)="downloadImage(generatedArt)" title="Download">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7,10 12,15 17,10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
        </div>
      </div>
      
      <div class="artwork-details">
        <h4>{{ generatedArt.title }}</h4>
        <p class="prompt-text">{{ generatedArt.prompt }}</p>
        <div class="action-buttons">
          <button class="done-btn" (click)="clearGeneratedArt()">
            ✓ Done - Add to Gallery
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
